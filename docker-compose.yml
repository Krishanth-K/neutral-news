services:
  db:
    image: pgvector/pgvector:pg16
    container_name: neutral_news_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: neutral_news
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: neutral_news_tunnel
    restart: unless-stopped
    network_mode: host  # reaches host's localhost:8000 directly (Linux only)
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
